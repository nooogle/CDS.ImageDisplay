name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer needs full history to compute version from tags

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The library multi-targets, so the tests run on both TFMs: the threading and
      # GDI+ code is exactly the kind that can behave differently on .NET Framework.
      - name: Test (net10.0-windows)
        run: dotnet run --project UnitTests/UnitTests.csproj --no-build --framework net10.0-windows -- --report-trx --results-directory TestResults

      - name: Test (net48)
        run: dotnet run --project UnitTests/UnitTests.csproj --no-build --framework net48 -- --report-trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Build Release
        run: dotnet build --configuration Release

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 (no floating v5 tag upstream — verify with git ls-remote before bumping)
