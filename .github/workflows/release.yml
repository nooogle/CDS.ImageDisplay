name: Release

on:
  push:
    tags:
      - 'V*.*.*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  LIBRARY_PROJECT: CDS.ImageDisplay.WinForms/CDS.ImageDisplay.WinForms.csproj
  TEST_PROJECT: UnitTests/UnitTests.csproj
  PACKAGE_ID: CDS.ImageDisplay.WinForms

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write

    environment: nuget

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history to compute version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.LIBRARY_PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.LIBRARY_PROJECT }} --configuration Release --no-restore

      - name: Test
        run: dotnet run --project ${{ env.TEST_PROJECT }} --configuration Release --framework net10.0-windows -- --report-trx

      - name: Pack
        run: dotnet pack ${{ env.LIBRARY_PROJECT }} --configuration Release --no-build --output ./artifacts

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          $version = (Get-ChildItem -Path ./artifacts -Filter "${{ env.PACKAGE_ID }}.*.nupkg").BaseName.Substring("${{ env.PACKAGE_ID }}".Length + 1)
          dotnet-CycloneDX ${{ env.LIBRARY_PROJECT }} -o ./artifacts -F json -sv $version

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./artifacts/*.nupkg

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: ./artifacts/*.nupkg
          sbom-path: ./artifacts/bom.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/bom.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate with NuGet (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-auth
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $pkg = (Get-ChildItem -Path ./artifacts -Filter "${{ env.PACKAGE_ID }}.*.nupkg").FullName
          dotnet nuget push $pkg --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $pkg = (Get-ChildItem -Path ./artifacts -Filter "${{ env.PACKAGE_ID }}.*.snupkg").FullName
          if ($pkg) {
            dotnet nuget push $pkg --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
