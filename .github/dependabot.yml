version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: [ "dependencies", "nuget" ]
    assignees: [ "nooogle" ]
    groups:
      # Majors are deliberately left out so they arrive as individual PRs for
      # review; dependabot-automerge.yml only auto-merges minor and patch.
      nuget-minor-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      nuget-security:
        applies-to: security-updates
        patterns: [ "*" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: [ "dependencies", "github_actions" ]
    assignees: [ "nooogle" ]
    groups:
      github-actions:
        patterns: [ "*" ]
